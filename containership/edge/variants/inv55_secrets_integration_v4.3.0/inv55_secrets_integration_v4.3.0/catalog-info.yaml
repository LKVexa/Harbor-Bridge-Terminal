# Backstage-style catalog entry. Owner/on-call are PLACEHOLDERS (docs/governance/OWNERSHIP.md).
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: inv55-secrets-integration
  title: INV-55 Secrets integration
  description: Brokers named, scoped, leased, versioned secrets from HashiCorp Vault.
  annotations:
    inv55/version: "4.3.0"
    inv55/approval-status: PENDING-OWNER-APPROVAL
    inv55/on-call: "<UNASSIGNED: paging-route>"
    inv55/data-classification: "secret-values: SECRET; secret-names: CONFIDENTIAL"
  tags: [secrets, vault, python]
spec:
  type: service
  lifecycle: experimental
  owner: "<UNASSIGNED: service-owner>"
  system: "<UNASSIGNED: system>"
  tier: "<UNASSIGNED: tier>"
  providesApis: [PK_SECRET_RESOLVE-1, PK_SECRET_ROTATE-1, PK_SECRET_SCOPE-1]
  dependsOn: ["resource:hashicorp-vault"]
