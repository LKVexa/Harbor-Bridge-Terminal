[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "inv66-enterprise-wasm-control-plane"
version = "4.3.0"
description = "INV-66 enterprise Wasm control plane: multi-lattice admission, RBAC, provenance and tamper-evident audit"
readme = "inv66_enterprise_wasm_control_plane/README.md"
requires-python = ">=3.11"
license = { text = "LicenseRef-INV66-Proprietary-Pending" }
authors = [{ name = "LinearFinance.org Research Division" }]
dependencies = ["cryptography>=42,<47"]

[project.optional-dependencies]
test = ["jsonschema==4.26.0"]
conformance = []   # pk_core is supplied by the Post-Kubernetes series runtime; see docs/COMPATIBILITY.md

[project.scripts]
inv66 = "inv66_enterprise_wasm_control_plane.cli:main"

[tool.setuptools]
packages = ["inv66_enterprise_wasm_control_plane"]

[tool.setuptools.package-data]
inv66_enterprise_wasm_control_plane = ["schemas/*.json", "*.md", "*.json", "VERSION"]
