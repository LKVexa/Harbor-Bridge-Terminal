[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inv44-wasm-hardening-system"
version = "4.3.0"
description = "INV-44 fail-closed Wasm hardening reference model: verifier, capabilities, tenant gateway, audit log, config and release gate."
readme = "README.md"
requires-python = ">=3.10"
# The owner has not chosen a license yet (see LICENSING.md). Do not redistribute.
license = { text = "LicenseRef-Proprietary-Pending" }
dependencies = []  # runtime is stdlib-only

[project.optional-dependencies]
# pk_core is required only for contract.py / component.py. Its version and
# digest are unknown (DEPENDENCIES.md); it is deliberately NOT pinned to a guess.
conformance = []

[project.scripts]
inv44-release-gate = "inv44_wasm_hardening_system.release_gate:main"

[tool.setuptools]
package-dir = { "inv44_wasm_hardening_system" = "." }
packages = ["inv44_wasm_hardening_system"]

[tool.setuptools.package-data]
inv44_wasm_hardening_system = ["schemas/*.json", "CHECKLIST.json", "POST_AUDIT_MATRIX.json",
                               "COMPONENTS_STATUS.json", "VERSION", "CHECKSUMS.sha256"]
