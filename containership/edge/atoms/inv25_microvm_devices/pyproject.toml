[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "inv25-microvm-devices"
version = "4.3.0"
description = "INV-25 MicroVM devices: paravirtual device catalogue, control plane and certification tooling"
readme = "README.md"
requires-python = ">=3.10,<3.14"
# Runtime is standard-library only. pk_core is needed only for the pk_core-driven 100-item assessment.
dependencies = []
# license: PENDING owner decision - no LICENSE file has been chosen (see AUDIT_REPORT.md)
classifiers = ["Programming Language :: Python :: 3", "Private :: Do Not Upload"]

[project.optional-dependencies]
pk = ["pk_core>=4.0,<5.0"]   # PROPOSED range; distribution source PENDING (docs/pk_core.md, W-0006)

[tool.setuptools]
package-dir = {"inv25_microvm_devices" = "."}
packages = ["inv25_microvm_devices"]

[tool.setuptools.package-data]
inv25_microvm_devices = ["VERSION", "CHECKLIST.json", "schemas/*.json"]
