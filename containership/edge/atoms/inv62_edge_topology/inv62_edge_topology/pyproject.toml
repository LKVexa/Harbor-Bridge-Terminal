[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inv62-edge-topology"
version = "4.3.0"
description = "INV-62 Edge topology: validated edge graph, policy-aware nearest-capable resolution, fenced site coordination"
readme = "README.md"
requires-python = ">=3.10,<3.14"
# Runtime is stdlib-only.  'cryptography' is needed only for encrypt_at_rest and release signing.
dependencies = []
license = {text = "UNDECIDED - see NOTICE.md (MC-090 open)"}

[project.optional-dependencies]
at-rest = ["cryptography>=42,<47"]
dev = ["ruff>=0.5", "mypy>=1.10", "cryptography>=42,<47"]

[project.scripts]
inv62-bootstrap = "inv62_edge_topology.production.bootstrap:main"

[tool.setuptools]
packages = ["inv62_edge_topology", "inv62_edge_topology.production"]
package-dir = {"inv62_edge_topology" = "."}

[tool.setuptools.package-data]
inv62_edge_topology = ["schemas/*.json", "fixtures/*.json", "CHECKLIST.json", "VERSION", "*.md"]

[tool.ruff]
line-length = 170
target-version = "py310"
extend-exclude = ["evidence", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S", "UP", "PL", "C4", "SIM", "RUF"]
ignore = [
  "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004",  # complexity: tracked by baseline, not blanket-banned
  "S101",                                                 # asserts only in tests; production uses explicit raises
  "E731", "E741", "PLC0415", "SIM105", "RUF012", "PLW2901", "SIM108", "RUF005",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "PL", "B", "E702", "RUF", "SIM", "E501"]
"tools/*" = ["S603", "S311", "PL", "E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
files = ["topology.py", "production"]

[[tool.mypy.overrides]]
module = ["pk_core", "pk_core.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["inv62_edge_topology.topology", "inv62_edge_topology.production.errors", "inv62_edge_topology.production.wire", "inv62_edge_topology.production.auth", "inv62_edge_topology.production.config"]
disallow_untyped_defs = true
