name: release
on: { push: { tags: ["v*"] } }
permissions: { contents: write, id-token: write, attestations: write }
defaults: { run: { working-directory: inv23_hardware_virtualization_primitive } }
jobs:
  release:
    runs-on: [self-hosted, inv23-benchmark-qualified]
    env: { INV23_CONFORMANCE: release, INV23_MACHINE_CLASS: qualified-linux-kvm, SOURCE_DATE_EPOCH: "1790121600" }
    steps:
      - uses: actions/checkout@v4
      - run: pip install ".[dev,test]"
      - name: reproducible build (twice) and compare
        run: |
          python -m build --outdir dist1 . && python -m build --outdir dist2 .
          sha256sum dist1/*.whl dist2/*.whl
          cmp dist1/*.whl dist2/*.whl || { echo "::error::wheel not reproducible"; exit 1; }
      - run: pip-audit --strict
      - name: production gate (fails on NO_GO / BLOCKED; CONDITIONAL_GO needs approved waivers)
        run: python tools/gate.py --wheel dist1/*.whl
      - run: python tools/verify_evidence.py --wheel dist1/*.whl --require-go
      - uses: actions/attest-build-provenance@v1
        with: { subject-path: "inv23_hardware_virtualization_primitive/dist1/*.whl" }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            inv23_hardware_virtualization_primitive/dist1/*
            inv23_hardware_virtualization_primitive/conformance/PK_GATE_RESULTS.json
            inv23_hardware_virtualization_primitive/evidence/*
