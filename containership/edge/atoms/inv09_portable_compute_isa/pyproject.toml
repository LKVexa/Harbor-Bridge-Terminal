[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inv09-portable-compute-isa"
version = "4.3.0"
description = "INV-09 portable compute ISA: fail-closed byte-level WebAssembly validation boundary"
requires-python = ">=3.10"
dependencies = [
  "cryptography>=42,<47",   # M08 Ed25519 attestations (fail closed if absent)
]
[project.optional-dependencies]
conformance = ["pk_core"]   # workspace package; not on PyPI - bind via PK_CORE_PATH
test = ["jsonschema>=4.20,<5"]

[tool.setuptools]
packages = ["inv09_portable_compute_isa", "inv09_portable_compute_isa.prod"]
package-dir = {"inv09_portable_compute_isa" = "."}
