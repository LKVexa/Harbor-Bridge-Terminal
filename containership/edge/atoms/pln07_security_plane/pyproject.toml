[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "pln07-security-plane"
version = "4.3.0"
description = "PLN-07 Security plane: attenuable capability grants, signing, revocation and service boundary"
requires-python = ">=3.10"
# LICENSE: not yet designated by the owner (MC-24 external blocker). Do not publish.
classifiers = ["Private :: Do Not Upload"]
dependencies = []

[project.optional-dependencies]
ed25519 = ["cryptography==46.0.7"]
gate = ["jsonschema==4.23.0"]
framework = []  # pk_core: pin here once MC-02 is closed, e.g. "pk_core==<version>"

[tool.setuptools]
packages = ["pln07_security_plane", "pln07_security_plane.tests", "pln07_security_plane.bench", "pln07_security_plane.ci", "pln07_security_plane.deploy"]
package-dir = {"pln07_security_plane" = "."}

[tool.setuptools.package-data]
pln07_security_plane = ["schemas/*.json", "tests/fuzz_corpus/*.json", "bench/*.json", "VERSION", "*.md"]
