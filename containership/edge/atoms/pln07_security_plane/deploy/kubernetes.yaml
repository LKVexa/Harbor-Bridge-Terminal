# Kubernetes rollout (MC-22). Canary via a separate Deployment with 1 replica and
# the same Service selector; promote by scaling stable and deleting canary.
apiVersion: apps/v1
kind: Deployment
metadata: {name: pln07-stable, labels: {app: pln07, track: stable}}
spec:
  replicas: 3
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app: pln07, track: stable}}
  template:
    metadata: {labels: {app: pln07, track: stable}}
    spec:
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: pln07
        image: registry.example.invalid/pln07:4.3.0   # replace with digest-pinned image@sha256:...
        args: ["python", "-m", "pln07_security_plane.deploy.host"]
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
        resources: {requests: {cpu: 250m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
        readinessProbe: {httpGet: {path: /readyz, port: 8707}, periodSeconds: 5}
        livenessProbe: {httpGet: {path: /livez, port: 8707}, periodSeconds: 10}
        env:
        - {name: PLN07_CONFIG, value: /etc/pln07/config.json}
        - {name: PLN07_REVOCATION_LOG, value: /var/lib/pln07/revocation.log}
        volumeMounts:
        - {name: config, mountPath: /etc/pln07, readOnly: true}
        - {name: state, mountPath: /var/lib/pln07}
      volumes:
      - {name: config, configMap: {name: pln07-config}}
      - {name: state, persistentVolumeClaim: {claimName: pln07-state}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: pln07-canary, labels: {app: pln07, track: canary}}
spec:
  replicas: 0   # set to 1 to start a canary; see docs/runbooks/day1-rollout.md
  selector: {matchLabels: {app: pln07, track: canary}}
  template:
    metadata: {labels: {app: pln07, track: canary}}
    spec:
      containers:
      - {name: pln07, image: "registry.example.invalid/pln07:NEXT", args: ["python", "-m", "pln07_security_plane.deploy.host"]}
---
apiVersion: v1
kind: Service
metadata: {name: pln07}
spec:
  selector: {app: pln07}
  ports: [{port: 8707, targetPort: 8707}]
