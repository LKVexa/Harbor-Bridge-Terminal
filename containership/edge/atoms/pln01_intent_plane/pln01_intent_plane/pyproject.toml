[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pln01-intent-plane"
version = "4.3.0"
description = "PLN-01 Intent plane: desired-state dependency graph, admission, and dry-run reconciliation planner"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "LicenseRef-LinearFinance-AllRightsReserved"}
authors = [{name = "David Paul Russell", email = "davidpaulrussell@linearfinance.org"}]
dependencies = []

[project.optional-dependencies]
pk-core = ["pk_core>=4.0,<5"]

[tool.setuptools]
package-dir = {"pln01_intent_plane" = "."}
packages = ["pln01_intent_plane"]

[tool.setuptools.package-data]
pln01_intent_plane = ["schemas/*.json", "VERSION"]
