name: inv70-ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12"]
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: {path: inv70_fast_agent_sandbox}
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - run: pip install pyyaml==6.0.2
      - name: Unit, integration, fuzz, governance
        run: for t in inv70_fast_agent_sandbox/tests/test_*.py; do python "$t" || exit 1; python -O "$t" || exit 1; done
  certify:
    needs: test
    runs-on: ubuntu-latest
    env: {INV70_SOURCE_REVISION: "${{ github.sha }}"}
    steps:
      - uses: actions/checkout@v4
        with: {path: inv70_fast_agent_sandbox}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pyyaml==6.0.2
      - run: pip install --require-hashes -r inv70_fast_agent_sandbox/requirements/wasm.lock
      - run: python inv70_fast_agent_sandbox/tools/check_lock.py
      - run: python -m inv70_fast_agent_sandbox.tools.bench --gate inv70_fast_agent_sandbox/perf/baseline.json --quick
      - run: python -m inv70_fast_agent_sandbox.tools.release_evidence --require-wasm
      - uses: actions/upload-artifact@v4
        with: {name: release-evidence, path: inv70_fast_agent_sandbox/RELEASE_EVIDENCE.json}
