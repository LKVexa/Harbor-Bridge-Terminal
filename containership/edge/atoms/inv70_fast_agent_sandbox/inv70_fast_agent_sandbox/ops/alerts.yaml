# INV-70 alert rules (Prometheus). Severity semantics in RUNBOOK.md.
groups:
- name: inv70
  rules:
  - alert: Inv70Halted
    expr: sum(rate(inv70_terminations_total{reason="FB-C003"}[5m])) > 0
    for: 1m
    labels: {severity: SEV1}
    annotations: {summary: "Sandbox in HALT (trust/time/audit lost)", runbook: "RUNBOOK.md#halt"}
  - alert: Inv70AuditUnavailable
    expr: sum(rate(inv70_terminations_total{reason="FB-S022"}[5m])) > 0
    labels: {severity: SEV1}
    annotations: {runbook: "RUNBOOK.md#halt"}
  - alert: Inv70SecurityDenialsSpike
    expr: sum(rate(inv70_terminations_total{reason=~"FB-S0.*"}[10m])) > 5 * sum(rate(inv70_terminations_total{reason=~"FB-S0.*"}[1d] offset 1d))
    for: 10m
    labels: {severity: SEV2}
    annotations: {runbook: "RUNBOOK.md#security-spike"}
  - alert: Inv70WorkerCrashes
    expr: sum(rate(inv70_terminations_total{reason=~"FB-I00.*"}[5m])) > 0.1
    for: 5m
    labels: {severity: SEV2}
    annotations: {runbook: "RUNBOOK.md#worker-crash"}
  - alert: Inv70Shedding
    expr: sum(rate(inv70_terminations_total{reason="FB-C001"}[5m])) / sum(rate(inv70_runs_total[5m])) > 0.05
    for: 10m
    labels: {severity: SEV3}
    annotations: {runbook: "RUNBOOK.md#overload"}
  - alert: Inv70LatencyP99
    expr: histogram_quantile(0.99, sum by (le) (rate(inv70_latency_us_bucket[5m]))) > 100000
    for: 15m
    labels: {severity: SEV3}
