[project]
name = "inv70-fast-agent-sandbox"
version = "4.3.0"
description = "INV-70 Fast agent sandbox: bounded execution with governed isolation, trust and observability"
requires-python = ">=3.10"
dependencies = []                     # runtime is stdlib-only

[project.optional-dependencies]
wasm = ["wasmtime==25.0.0"]           # exact pin; hash in requirements/wasm.lock (ADR-0001)
dev = ["pyyaml==6.0.2"]               # RTM/EXCEPTIONS parsing in governance tests and tools
framework = ["pk_core"]               # optional conformance framework (not vendored)
