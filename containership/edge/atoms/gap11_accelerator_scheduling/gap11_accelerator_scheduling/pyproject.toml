[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gap11-accelerator-scheduling"
version = "4.3.0"
description = "GAP-11 accelerator scheduling: audited allocator + durable, fenced, idempotent control plane (stdlib only)"
requires-python = ">=3.10"
dependencies = []                      # stdlib only; enforced by release/SBOM.cdx.json and ci.sh
license = { text = "UNSPECIFIED - no licence was supplied with the source package; owner must choose" }

[project.optional-dependencies]
series = ["pk_core>=4.0,<5"]           # only component.py / contract.py; untested (pk_core not supplied)

[tool.setuptools]
packages = ["gap11_control"]
