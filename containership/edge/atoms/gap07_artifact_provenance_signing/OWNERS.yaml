# Ownership / escalation metadata (#41). Role structure is defined; named people are the estate's to assign.
component: GAP-07
package_owner_of_record: "David Paul Russell <davidpaulrussell@linearfinance.org>"   # owner of this package build
roles:
  accountable_service_owner: UNASSIGNED
  technical_reviewer: UNASSIGNED
  security_reviewer: UNASSIGNED          # independent of the implementers (docs/SECURITY_REVIEW.md)
  key_custodian: UNASSIGNED
  config_authority_holders: [UNASSIGNED, UNASSIGNED]   # >= 2 for recovery approvals
  waiver_approvers: [UNASSIGNED, UNASSIGNED]
oncall:
  route: UNASSIGNED
  severity_model:
    sev1: "key compromise, forged artifact admitted, audit chain broken, INTERNAL_ERROR in admission"
    sev2: "revocation SLO breach, trust/time/tlog stale fleet-wide, KMS outage > 15 min"
    sev3: "single-site staleness, overload shedding > 1 %, benchmark regression"
review_cadence:
  threat_model: quarterly
  algorithm_registry: semiannual
  waivers: weekly
  owners_file: quarterly
