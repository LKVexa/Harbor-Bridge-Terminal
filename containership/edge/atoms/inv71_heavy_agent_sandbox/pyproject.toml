[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inv71-heavy-agent-sandbox"
version = "4.3.0"
description = "INV-71 heavy agent sandbox: reference model, reference control layer, evidence and production gate (not a Firecracker runtime)"
requires-python = ">=3.10"
dependencies = []
# license: intentionally unset - see LICENSE_STATUS.md

[project.optional-dependencies]
test = ["jsonschema==4.23.0"]

[tool.setuptools]
package-dir = {"inv71_heavy_agent_sandbox" = "."}
packages = ["inv71_heavy_agent_sandbox", "inv71_heavy_agent_sandbox.control"]
