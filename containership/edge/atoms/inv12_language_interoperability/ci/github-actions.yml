# MC-054: copy to .github/workflows/inv12.yml in the hosting repository.
name: inv12-conformance
on: [push, pull_request]
permissions: {contents: read}
jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14, windows-2022]   # x86-64 + ARM64 (MC-033)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: {path: inv12_language_interoperability}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/setup-go@v5
        with: {go-version: "1.24"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - uses: dtolnay/rust-toolchain@stable
        with: {components: clippy}
      - run: pip install ruff==0.15.11
      - run: python inv12_language_interoperability/tools/ci.py
        env: {PK_CORE_PATH: "${{ github.workspace }}/pk_core_checkout"}
      - uses: actions/upload-artifact@v4
        with: {name: evidence-${{ matrix.os }}, path: inv12_language_interoperability/evidence/}
