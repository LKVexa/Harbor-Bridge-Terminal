[build-system]
requires = ["setuptools>=68,<70"]
build-backend = "setuptools.build_meta"

[project]
name = "pln05-elasticity-plane"
version = "4.2.0"
description = "PLN-05 elasticity plane: hysteretic capacity-target controller with its service boundary"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "LicenseRef-PLN05-Owner-Pending"}
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent",
               "Private :: Do Not Upload"]

[project.optional-dependencies]
framework = ["pk_core>=4.0,<5.0"]
test = []
bench = []
docs = []
dev = []

[project.scripts]
pln05 = "pln05_elasticity_plane.cli:main"

[tool.setuptools]
package-dir = {"pln05_elasticity_plane" = "."}
packages = ["pln05_elasticity_plane"]

[tool.setuptools.package-data]
pln05_elasticity_plane = ["schemas/*.json", "config/*.json", "security/*.json", "VERSION", "NOTICE",
                          "LICENSE-PENDING.md", "build_info.json"]
