# PLN-05 release. Runs only on protected tags in the protected 'release' environment.
# pk_core must be resolvable here (framework tier); the job fails if any mandatory check is skipped.
name: pln05-release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write     # attach artifacts to the release
      id-token: write     # managed signing (Sigstore) once adopted
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with: {path: pln05_elasticity_plane, persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with: {python-version: "3.11"}
      - run: python pln05_elasticity_plane/tools/ci.py --release --out release-evidence
      - run: python pln05_elasticity_plane/tools/gate.py --evidence release-evidence
      - uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b  # v4.5.0
        with: {name: release, path: release-evidence}
