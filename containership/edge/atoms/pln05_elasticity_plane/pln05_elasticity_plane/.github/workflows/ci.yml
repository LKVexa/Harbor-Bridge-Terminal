# PLN-05 presubmit CI. Mirrors `python3 tools/ci.py` exactly (the local command is authoritative).
# NOTE: written by the 4.2.0 pass and not yet executed on a forge; action SHAs must be verified
# against the upstream tags before enabling (MC-33 note).
name: pln05-ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with: {path: pln05_elasticity_plane, persist-credentials: false}
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with: {python-version: "${{ matrix.python }}"}
      - run: python pln05_elasticity_plane/tools/ci.py --out ci-evidence
      - uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b  # v4.5.0
        if: always()
        with: {name: "evidence-${{ matrix.os }}-${{ matrix.python }}", path: ci-evidence}
