[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inv18-completion-primitive"
version = "4.3.0"
description = "INV-18 Completion primitive: typed one-shot future<T> with governed runtime, wire contract and release gate"
requires-python = ">=3.10,<3.14"
dependencies = []          # stdlib only; pk_core is an optional audit integration (see requirements.lock.json)
license = { text = "UNLICENSED - owner to set before distribution" }
authors = [{ name = "David Paul Russell", email = "davidpaulrussell@linearfinance.org" }]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.optional-dependencies]
audit = []                 # pk_core: pinned by digest once vendored (W-C031)

[project.scripts]
inv18 = "inv18_completion_primitive.__main__:main"

[tool.setuptools]
packages = ["inv18_completion_primitive"]
package-dir = { "inv18_completion_primitive" = "." }

[tool.setuptools.package-data]
inv18_completion_primitive = ["*.json", "*.md", "VERSION", "SHA256SUMS", "CODEOWNERS", "schemas/*.json",
  "fixtures/**/*.json", "config/*.json", "conformance/*.json", "governance/*.json", "dashboards/*.json",
  "docs/**/*.md", "tests/*.py", "tools/*.py", "examples/*.py"]
