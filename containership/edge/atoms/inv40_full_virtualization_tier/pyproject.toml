[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inv40-full-virtualization-tier"
version = "4.3.0"
description = "INV-40 Full virtualization tier: reference runtime + production-hardening layer (KVM/QEMU adapter)"
requires-python = ">=3.10"
license = {text = "UNLICENSED - all rights reserved pending owner decision"}
dependencies = []

[project.optional-dependencies]
# REPO-001: pk_core range is UNPINNED because no distribution was supplied.
pk_core = ["pk_core"]

[tool.setuptools]
package-dir = {"inv40_full_virtualization_tier" = "."}
packages = ["inv40_full_virtualization_tier", "inv40_full_virtualization_tier.fvt"]

[tool.setuptools.package-data]
inv40_full_virtualization_tier = ["schemas/*.json", "CHECKLIST.json", "VERSION"]
