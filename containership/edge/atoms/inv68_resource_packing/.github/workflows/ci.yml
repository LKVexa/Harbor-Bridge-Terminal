# INV-68 CI (MC-41). Defined in 4.3.0; NOT executed in the build that produced this release.
# Trust model: pull requests run untrusted with read-only token and no secrets; the release job
# runs only on protected tags, in a protected environment, with the managed signing key.
name: inv68-ci
on:
  pull_request:
  push:
    branches: [main]
    tags: ["inv68-v*"]
permissions:
  contents: read
concurrency:
  group: inv68-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4  # TODO(MC-41): pin to a verified commit SHA before enabling
        with: { path: inv68_resource_packing, persist-credentials: false }
      - uses: actions/setup-python@v5  # TODO(MC-41): pin SHA
        with: { python-version: "${{ matrix.python }}" }
      - name: dev tooling (pinned)
        run: python -m pip install -r inv68_resource_packing/requirements-dev.lock
      - name: compile
        run: python -m compileall -q inv68_resource_packing
      - name: evidence (quick)
        env: { PYTHONHASHSEED: "0" }
        run: python -m inv68_resource_packing.tools.run_evidence --quick --out evidence-${{ matrix.os }}-${{ matrix.python }}
      - uses: actions/upload-artifact@v4  # TODO(MC-41): pin SHA
        if: always()
        with: { name: "evidence-${{ matrix.os }}-${{ matrix.python }}", path: "evidence-*", retention-days: 30 }
  conformance:
    # pk_core is not public; this job runs only where the org provides it (MC-02).
    if: ${{ vars.PK_CORE_AVAILABLE == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: inv68_resource_packing, persist-credentials: false }
      - name: pk_core gate
        env: { PK_CORE_PATH: "${{ vars.PK_CORE_PATH }}" }
        run: |
          python -m pk_core gate INV-68 --out PK_GATE_RESULTS.json
          python -m inv68_resource_packing.tools.preflight --certification
  release:
    if: startsWith(github.ref, 'refs/tags/inv68-v')
    needs: [verify, conformance]
    runs-on: ubuntu-latest
    environment: inv68-release   # protected: required reviewers = release_manager
    permissions: { contents: write, id-token: write }
    steps:
      - uses: actions/checkout@v4
        with: { path: inv68_resource_packing, persist-credentials: false }
      - name: full evidence + gate (certification)
        run: python -m inv68_resource_packing.tools.run_evidence --certification --soak-seconds 3600 --pk-gate PK_GATE_RESULTS.json --approval APPROVAL.json
      - name: signed release
        env:
          INV68_SIGNING_KEY_HEX: ${{ secrets.INV68_SIGNING_KEY_HEX }}
          INV68_SIGNING_KID: ${{ vars.INV68_SIGNING_KID }}
        run: python -m inv68_resource_packing.tools.release build --out release
