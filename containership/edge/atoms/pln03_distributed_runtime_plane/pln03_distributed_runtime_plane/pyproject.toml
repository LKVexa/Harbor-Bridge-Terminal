[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pln03-distributed-runtime-plane"
version = "4.3.0"
description = "PLN-03 distributed runtime plane - governed reference runtime"
requires-python = ">=3.10"
dependencies = []            # runtime is dependency-free by design (MC-026)
# license: intentionally unset until the owner selects one (MC-056, BLOCKED)

[project.optional-dependencies]
conformance = []             # pk_core: no pinned source exists yet (MC-055, BLOCKED) - see DEPENDENCIES.lock.json

[tool.setuptools]
package-dir = {"pln03_distributed_runtime_plane" = "."}
packages = ["pln03_distributed_runtime_plane"]

[tool.setuptools.package-data]
pln03_distributed_runtime_plane = ["schemas/*.json", "wit/*.wit", "fixtures/conformance/*.json", "VERSION"]
