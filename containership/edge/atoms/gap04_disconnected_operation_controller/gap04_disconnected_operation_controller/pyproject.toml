[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gap04-disconnected-operation-controller"
version = "4.3.0"
description = "GAP-04 disconnected-operation controller: bounded site autonomy during control-plane partition"
requires-python = ">=3.10"
license = {text = "Proprietary - LinearFinance.org (see GOVERNANCE.md)"}
dependencies = ["cryptography==46.0.7"]

[project.optional-dependencies]
conformance = ["pk_core"]

[tool.setuptools]
packages = ["gap04_disconnected_operation_controller", "gap04_disconnected_operation_controller.runtime"]
package-dir = {"gap04_disconnected_operation_controller" = "."}

[tool.setuptools.package-data]
gap04_disconnected_operation_controller = ["schemas/*.json", "VERSION", "*.md", "docs/*.md", "ops/*", "evidence/*.json"]
