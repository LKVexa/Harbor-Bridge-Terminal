[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "inv31-function-execution-architecture"
version = "4.3.0"
description = "INV-31 function-instance lifecycle, reuse rule and authenticated invocation boundary"
requires-python = ">=3.10"
# The runtime, boundary and configuration layers use only the standard library.
dependencies = []
# license: intentionally not declared - no licence has been chosen by the owner (see OWNERSHIP.md, item A08)

[project.optional-dependencies]
# pk_core has no published coordinate or approved pin (item A01). When the release
# owner supplies one, pin it here by exact version, e.g. "pk_core==<version>".
conformance = []

[tool.setuptools]
packages = ["inv31_function_execution_architecture", "inv31_function_execution_architecture.tests"]
package-dir = {"inv31_function_execution_architecture" = ".", "inv31_function_execution_architecture.tests" = "tests"}

[tool.setuptools.package-data]
inv31_function_execution_architecture = ["schemas/*.json", "config/*.json", "fixtures/*.json", "*.md", "VERSION", "CHECKLIST.json"]
