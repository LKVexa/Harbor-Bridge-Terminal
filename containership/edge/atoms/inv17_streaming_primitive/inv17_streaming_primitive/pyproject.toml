[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inv17-streaming-primitive"
version = "4.3.0"
description = "INV-17 Streaming primitive: typed, credit-limited, explicitly terminated streams (Post-Kubernetes series)"
requires-python = ">=3.10"
dependencies = []   # runtime is stdlib-only; pk_core 4.0.0 is vendored for the conformance adapter only

[project.optional-dependencies]
dev = ["ruff==0.15.11", "mypy==1.20.2"]   # pinned; CI installs exactly these

[tool.setuptools]
packages = ["inv17_streaming_primitive"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["vendor", "benchmarks/reference", "MASTER.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S", "UP"]
ignore = ["E701", "E702", "E731", "S101", "B904", "UP007", "UP035"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "E741", "F841", "E501", "E402", "UP"]
"contract.py" = ["E501"]
"component.py" = ["E501", "E402"]
"tools/*" = ["S", "E401", "E741", "E501", "UP", "B"]

[tool.mypy]
python_version = "3.10"
files = ["stream.py", "security.py", "control.py", "configuration.py", "observability.py", "adapters.py", "wire.py"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
