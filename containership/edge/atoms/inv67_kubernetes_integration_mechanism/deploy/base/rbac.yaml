apiVersion: "v1"
kind: "ServiceAccount"
metadata:
  name: "inv67-controller"
  namespace: "inv67-system"
automountServiceAccountToken: true
---
apiVersion: "rbac.authorization.k8s.io/v1"
kind: "ClusterRole"
metadata:
  name: "inv67-controller"
rules:
  - apiGroups:
      - "inv67.linearfinance.org"
    resources:
      - "wasmworkloads"
    verbs:
      - "get"
      - "list"
      - "watch"
      - "update"
  - apiGroups:
      - "inv67.linearfinance.org"
    resources:
      - "wasmworkloads/status"
    verbs:
      - "get"
      - "update"
  - apiGroups:
      - ""
    resources:
      - "events"
    verbs:
      - "create"
  - apiGroups:
      - "authentication.k8s.io"
    resources:
      - "tokenreviews"
    verbs:
      - "create"
---
apiVersion: "rbac.authorization.k8s.io/v1"
kind: "ClusterRoleBinding"
metadata:
  name: "inv67-controller"
roleRef:
  apiGroup: "rbac.authorization.k8s.io"
  kind: "ClusterRole"
  name: "inv67-controller"
subjects:
  - kind: "ServiceAccount"
    name: "inv67-controller"
    namespace: "inv67-system"
---
apiVersion: "rbac.authorization.k8s.io/v1"
kind: "Role"
metadata:
  name: "inv67-leader-election"
  namespace: "inv67-system"
rules:
  - apiGroups:
      - "coordination.k8s.io"
    resources:
      - "leases"
    verbs:
      - "get"
      - "create"
      - "update"
---
apiVersion: "rbac.authorization.k8s.io/v1"
kind: "RoleBinding"
metadata:
  name: "inv67-leader-election"
  namespace: "inv67-system"
roleRef:
  apiGroup: "rbac.authorization.k8s.io"
  kind: "Role"
  name: "inv67-leader-election"
subjects:
  - kind: "ServiceAccount"
    name: "inv67-controller"
    namespace: "inv67-system"
