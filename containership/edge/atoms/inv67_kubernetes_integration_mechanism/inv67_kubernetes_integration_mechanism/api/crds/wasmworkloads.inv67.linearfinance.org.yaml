apiVersion: "apiextensions.k8s.io/v1"
kind: "CustomResourceDefinition"
metadata:
  name: "wasmworkloads.inv67.linearfinance.org"
  annotations:
    inv67.linearfinance.org/owner: "see docs/OWNERSHIP.md"
spec:
  group: "inv67.linearfinance.org"
  scope: "Namespaced"
  names:
    plural: "wasmworkloads"
    singular: "wasmworkload"
    kind: "WasmWorkload"
    shortNames:
      - "wwl"
    categories:
      - "inv67"
  versions:
    - name: "v1alpha1"
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: "Phase"
          type: "string"
          jsonPath: ".status.phase"
        - name: "State"
          type: "string"
          jsonPath: ".status.state"
        - name: "Ready"
          type: "string"
          jsonPath: ".status.conditions[?(@.type==\"Ready\")].status"
        - name: "Age"
          type: "date"
          jsonPath: ".metadata.creationTimestamp"
      schema:
        openAPIV3Schema:
          type: "object"
          required:
            - "spec"
          properties:
            apiVersion:
              type: "string"
            kind:
              type: "string"
            metadata:
              type: "object"
            spec:
              type: "object"
              required:
                - "template"
              properties:
                template:
                  type: "object"
                  required:
                    - "spec"
                  properties:
                    metadata:
                      type: "object"
                      additionalProperties: false
                      properties:
                        labels:
                          type: "object"
                          additionalProperties:
                            type: "string"
                        annotations:
                          type: "object"
                          additionalProperties:
                            type: "string"
                    spec:
                      type: "object"
                      required:
                        - "containers"
                      x-kubernetes-preserve-unknown-fields: true
                      properties:
                        containers:
                          type: "array"
                          minItems: 1
                          maxItems: 32
                          items:
                            type: "object"
                            required:
                              - "name"
                              - "image"
                            additionalProperties: false
                            properties:
                              name:
                                type: "string"
                                maxLength: 63
                                pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
                              image:
                                type: "string"
                                minLength: 1
                                maxLength: 512
                              resources:
                                type: "object"
                                additionalProperties: false
                                properties:
                                  requests:
                                    type: "object"
                                    additionalProperties: false
                                    properties:
                                      cpu:
                                        type: "string"
                                        pattern: "^[0-9]+(\\.[0-9]+)?([eE][+-]?[0-9]+|Ki|Mi|Gi|Ti|Pi|Ei|n|u|m|k|M|G|T|P|E)?$"
                                        maxLength: 128
                                      memory:
                                        type: "string"
                                        pattern: "^[0-9]+(\\.[0-9]+)?([eE][+-]?[0-9]+|Ki|Mi|Gi|Ti|Pi|Ei|n|u|m|k|M|G|T|P|E)?$"
                                        maxLength: 128
                                  limits:
                                    type: "object"
                                    additionalProperties: false
                                    properties:
                                      cpu:
                                        type: "string"
                                        pattern: "^[0-9]+(\\.[0-9]+)?([eE][+-]?[0-9]+|Ki|Mi|Gi|Ti|Pi|Ei|n|u|m|k|M|G|T|P|E)?$"
                                        maxLength: 128
                                      memory:
                                        type: "string"
                                        pattern: "^[0-9]+(\\.[0-9]+)?([eE][+-]?[0-9]+|Ki|Mi|Gi|Ti|Pi|Ei|n|u|m|k|M|G|T|P|E)?$"
                                        maxLength: 128
            status:
              type: "object"
              x-kubernetes-preserve-unknown-fields: true
              properties:
                observedGeneration:
                  type: "integer"
                phase:
                  type: "string"
                  enum:
                    - "Pending"
                    - "Running"
                    - "Succeeded"
                    - "Failed"
                    - "Unknown"
                state:
                  type: "string"
                appId:
                  type: "string"
                  nullable: true
                attempt:
                  type: "integer"
                attemptId:
                  type: "string"
                conditions:
                  type: "array"
                  x-kubernetes-list-type: "map"
                  x-kubernetes-list-map-keys:
                    - "type"
                  items:
                    type: "object"
                    required:
                      - "type"
                      - "status"
                      - "reason"
                      - "lastTransitionTime"
                    properties:
                      type:
                        type: "string"
                      status:
                        type: "string"
                        enum:
                          - "True"
                          - "False"
                          - "Unknown"
                      reason:
                        type: "string"
                      message:
                        type: "string"
                        maxLength: 512
                      lastTransitionTime:
                        type: "string"
                        format: "date-time"
                      observedGeneration:
                        type: "integer"
          x-kubernetes-validations:
            - rule: "self.metadata.name.size() <= 63"
              message: "name must be <= 63 chars"
