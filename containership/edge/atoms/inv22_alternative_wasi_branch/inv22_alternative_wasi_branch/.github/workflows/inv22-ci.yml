# INV-22 CI/release pipeline (MC-33, MC-50, MC-51, MC-52, MC-53, MC-54). Written in v4.3.0; not yet executed.
name: inv22
on: [push, pull_request]
permissions: { contents: read }
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
        python: ["3.10", "3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: inv22_alternative_wasi_branch } }
    steps:
      - uses: actions/checkout@v4
        with: { path: inv22_alternative_wasi_branch }
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install --require-hashes -r requirements.lock && pip install "jsonschema>=4.26,<5" "coverage>=7.6,<8" ruff==0.15.11 mypy==1.20.2
      - run: ruff check .
      - run: python -m inv22_alternative_wasi_branch.reference --check
        working-directory: .
      - run: coverage run -m unittest discover -s tests -t tests && coverage report
      - run: python -O -m unittest discover -s tests -t tests
  full-conformance:          # must not skip; fails while pk_core is absent (MC-01)
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { path: inv22_alternative_wasi_branch }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install --require-hashes -r inv22_alternative_wasi_branch/requirements.lock
      - run: python -m inv22_alternative_wasi_branch.cli preflight --strict
      - run: python -m inv22_alternative_wasi_branch.cli evidence --out evidence
      - uses: actions/upload-artifact@v4
        with: { name: inv22-evidence, path: evidence }
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: full-conformance
    runs-on: ubuntu-24.04
    permissions: { contents: write, id-token: write, attestations: write }
    steps:
      - uses: actions/checkout@v4
        with: { path: inv22_alternative_wasi_branch }
      - run: test "v$(cat inv22_alternative_wasi_branch/VERSION)" = "${GITHUB_REF_NAME}"
      - run: pip install build==1.2.2 pip-audit==2.7.3 && cd inv22_alternative_wasi_branch && SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) python -m build
      - run: pip-audit -r inv22_alternative_wasi_branch/requirements.lock --strict
      - uses: actions/attest-build-provenance@v1
        with: { subject-path: "inv22_alternative_wasi_branch/dist/*" }
