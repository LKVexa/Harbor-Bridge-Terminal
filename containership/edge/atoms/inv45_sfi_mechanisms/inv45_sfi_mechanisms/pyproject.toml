[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inv45-sfi-mechanisms"
version = "4.3.0"
description = "INV-45 software fault isolation: Wasm SFI rewriter/verifier, trusted loader and reference model"
requires-python = ">=3.10"
dependencies = ["cryptography>=41,<47"]
# license: intentionally unset - see LICENSE-STATUS.md

[project.optional-dependencies]
test = ["jsonschema>=4.18,<5"]
pkcore = []  # pk_core: UNRESOLVED external dependency (docs/architecture/COMPATIBILITY.md)

[tool.setuptools]
packages = ["inv45_sfi_mechanisms", "inv45_sfi_mechanisms.production"]
package-dir = {"inv45_sfi_mechanisms" = "."}

[tool.setuptools.package-data]
"inv45_sfi_mechanisms.production" = ["engine_runner.js"]
