[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inv39-process-sandbox-tier"
version = "5.1.0"
description = "INV-39 process sandbox tier: seccomp-BPF/namespaces/capabilities launcher with kernel read-back evidence"
requires-python = ">=3.10,<3.14"
dependencies = []                      # runtime is stdlib-only
# license: NOT DECLARED - the owner has not chosen a licence (MC-106 BLOCKED)

[project.optional-dependencies]
# pk_core is an internal, unpublished framework from the Post-Kubernetes series; pin by digest
# once the owner supplies the wheel (MC-021/MC-094): pk_core @ file:///<path>/pk_core-<ver>.whl#sha256=<digest>
estate = []

[tool.inv39]
supported_python = ["3.10", "3.11", "3.12", "3.13"]
tested_python = ["3.11"]
supported_kernels = ">=5.13 (Landlock ABI>=1 optional), seccomp filter mode, user namespaces"
