[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inv19-os-asynchronous-analogues"
version = "5.0.0"
description = "INV-19 host asynchronous backends (io_uring / IOCP / epoll / kqueue / portable) with evidence gate"
requires-python = ">=3.10,<3.14"
dependencies = []                      # runtime is standard library only

[project.optional-dependencies]
signing = ["cryptography>=42"]         # Ed25519 audit checkpoints, manifest and evidence signatures
# pk_core is required for the pk_core 100-item component gate only.  Its
# authoritative source and version are UNRESOLVED (deps/pk_core.lock.json);
# it is intentionally NOT listed with a range here, because an unpinned
# requirement would let a silent upgrade satisfy the gate.
gate = []
