[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inv66-enterprise-wasm-control-plane"
version = "4.3.0"
description = "INV-66 enterprise Wasm control plane: authenticated admission, RBAC, provenance, anchored audit journal"
requires-python = ">=3.11"
# License: NOT SELECTED (LICENSE-STATUS.md). No license classifier is declared on purpose.
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
test = ["jsonschema>=4.20"]

[project.scripts]
inv66 = "inv66_enterprise_wasm_control_plane.production.cli:main"

[tool.setuptools]
package-dir = {"inv66_enterprise_wasm_control_plane" = "."}
packages = ["inv66_enterprise_wasm_control_plane", "inv66_enterprise_wasm_control_plane.production"]

[tool.setuptools.package-data]
inv66_enterprise_wasm_control_plane = ["schemas/*.json", "schemas/*.pin", "CHECKLIST.json", "VERSION", "MASTER.md", "LICENSE-STATUS.md", "THIRD-PARTY-NOTICES.md"]
