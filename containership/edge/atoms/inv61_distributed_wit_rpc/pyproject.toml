[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inv61-distributed-wit-rpc"
version = "4.3.0"
description = "INV-61 Distributed WIT RPC: typed cross-host invocation with signature fingerprints"
requires-python = ">=3.10"
license = { text = "UNDECLARED - owner to confirm (see docs/DEPENDENCIES.md)" }
dependencies = [
  # the only third-party runtime dependency; AES-GCM for the record layer (M08)
  "cryptography==46.0.7",
]

[project.optional-dependencies]
# M01: pk_core powers the contract/component gate layer. Its canonical source,
# version and digest are unknown and it is absent from the supplied archive, so
# it cannot be pinned here yet. Status BLOCKED in CHECKLIST_STATUS.json.
gate = []

[tool.setuptools]
packages = ["inv61_distributed_wit_rpc", "inv61_distributed_wit_rpc.wrpc"]
package-dir = { "inv61_distributed_wit_rpc" = "." }
