[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gap06-device-identity-and-attestation"
version = "5.0.0"
description = "GAP-06 device identity and attestation (reference implementation; not production-authorised)"
requires-python = ">=3.11"
dependencies = ["cryptography==46.0.7"]
license = {text = "UNDECIDED - owner decision required (see SECURITY.md / CHECKLIST_STATUS.md 53.01)"}

[tool.setuptools]
packages = ["gap06_device_identity_and_attestation", "gap06_device_identity_and_attestation.mc", "gap06_device_identity_and_attestation.tools"]
package-dir = {"gap06_device_identity_and_attestation" = "."}
