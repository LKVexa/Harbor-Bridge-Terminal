[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "inv04-current-orchestration"
version = "4.3.0"
description = "INV-04 incumbent-orchestrator behavioural model and dependency-free production runtime layer"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary - LinearFinance.org; see docs/OWNERS.md" }
dependencies = []  # runtime is stdlib-only by design (ADR-0001)
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.optional-dependencies]
# The estate conformance framework is not published to a public index; pin it
# from the internal source (component 78) - see tools/pk_core_gate.py.
pk-core = ["pk_core==4.0.*"]
dev = ["ruff==0.15.11", "mypy==1.20.2"]

[tool.setuptools]
packages = ["inv04_current_orchestration", "inv04_current_orchestration.runtime"]
package-dir = { "inv04_current_orchestration" = "." }

[tool.setuptools.package-data]
inv04_current_orchestration = ["schemas/*.json", "fixtures/*.json", "CHECKLIST.json", "COMPONENT_STATUS.json",
                               "VERSION", "*.md", "docs/*.md"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S"]
ignore = ["E501", "E702", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S603", "S404", "S101", "S301", "S403", "B017", "E731"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
exclude = ["tests/", "contract\\.py", "component\\.py"]
