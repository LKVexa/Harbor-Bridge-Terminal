[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inv55-secrets-integration"
version = "4.3.0"
description = "INV-55 Secrets integration: scoped, versioned, leased secret resolution with a Vault KV v2 adapter (stdlib only)"
requires-python = ">=3.10"
dependencies = []            # stdlib only; pk_core is an optional estate dependency
readme = "README.md"
# license: NOT SET - owner decision pending (WAIVERS.json W-011)

[project.optional-dependencies]
estate = []                  # pk_core is not published; supply via PK_CORE_PATH

[tool.setuptools]
packages = ["inv55_secrets_integration", "inv55_secrets_integration.runtime", "inv55_secrets_integration.tools"]
package-dir = {"inv55_secrets_integration" = "."}

[tool.setuptools.package-data]
inv55_secrets_integration = ["schemas/*.json", "CHECKLIST.json", "VERSION"]
