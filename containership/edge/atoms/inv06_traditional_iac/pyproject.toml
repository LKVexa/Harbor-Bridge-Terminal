[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "inv06-traditional-iac"
version = "4.3.0"
description = "INV-06 Traditional IaC reference state engine and production-component references (Post-Kubernetes series)"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = []
license = { text = "UNDECIDED - see LICENSE (owner decision required, MC-072)" }
authors = [{ name = "LinearFinance.org Research Division" }]
classifiers = ["Programming Language :: Python :: 3", "Private :: Do Not Upload"]

[project.optional-dependencies]
parent = []  # pk_core is supplied by the Post-Kubernetes workspace; no public distribution exists

[tool.setuptools]
package-dir = { "inv06_traditional_iac" = "." }
packages = ["inv06_traditional_iac", "inv06_traditional_iac.tests"]

[tool.setuptools.package-data]
inv06_traditional_iac = ["schemas/*.json", "fixtures/*.json", "governance/*", "*.md", "*.json", "VERSION"]
