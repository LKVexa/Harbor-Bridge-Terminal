[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inv43-transient-execution-defense"
version = "4.3.0"
description = "INV-43 transient-execution defense: read-back mitigation posture and fail-closed co-tenancy decisions"
requires-python = ">=3.10"
dependencies = []  # runtime is stdlib-only
# license: UNDECIDED - see NOTICE and remediation item 52; no license field until the owner approves one
classifiers = ["Programming Language :: Python :: 3", "Operating System :: POSIX :: Linux", "Private :: Do Not Upload"]

[project.optional-dependencies]
dev = ["jsonschema==4.26.0"]
core = []  # pk_core: version pin UNRESOLVED - see deps/pk_core.lock.json

[tool.setuptools]
packages = ["inv43_transient_execution_defense"]
package-dir = {"inv43_transient_execution_defense" = "."}

[tool.setuptools.package-data]
inv43_transient_execution_defense = ["schemas/*.json", "policy/*.json", "CHECKLIST.json", "VERSION"]
