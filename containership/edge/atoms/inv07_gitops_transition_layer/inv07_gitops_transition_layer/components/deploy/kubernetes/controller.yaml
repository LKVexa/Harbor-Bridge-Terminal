# Least-privilege INV-07 controller for one tenant namespace (acme / edge-1).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: inv07-controller
  namespace: inv07-acme
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: inv07-apply
  namespace: team-a
rules:
  - apiGroups: [""]
    resources: ["configmaps", "services", "serviceaccounts"]
    verbs: ["get", "list", "watch", "patch", "create", "update", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "patch", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: inv07-apply
  namespace: team-a
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: inv07-apply
subjects:
  - kind: ServiceAccount
    name: inv07-controller
    namespace: inv07-acme
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: inv07-lease
  namespace: inv07-acme
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inv07-controller
  namespace: inv07-acme
spec:
  replicas: 2
  selector:
    matchLabels: {app: inv07-controller}
  template:
    metadata:
      labels: {app: inv07-controller}
    spec:
      serviceAccountName: inv07-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: controller
          image: registry.example/inv07-controller@sha256:PIN_REQUIRED
          args: ["sync", "/etc/inv07/config.json", "--base-dir", "/var/lib/inv07"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/inv07, readOnly: true}
            - {name: secrets, mountPath: /run/secrets/inv07/acme, readOnly: true}
            - {name: state, mountPath: /var/lib/inv07}
      volumes:
        - name: config
          configMap: {name: inv07-config}
        - name: secrets
          secret: {secretName: inv07-acme-git, defaultMode: 0400}
        - name: state
          persistentVolumeClaim: {claimName: inv07-state}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: inv07-egress
  namespace: inv07-acme
spec:
  podSelector:
    matchLabels: {app: inv07-controller}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
      ports: [{port: 8443, protocol: TCP}]
  egress:
    - ports: [{port: 443, protocol: TCP}, {port: 53, protocol: UDP}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: inv07-controller
  namespace: inv07-acme
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: inv07-controller}
