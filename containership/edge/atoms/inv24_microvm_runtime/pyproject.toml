[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inv24-microvm-runtime"
version = "4.3.0"
description = "INV-24 MicroVM runtime: Firecracker-shaped minimal-device VMM tier"
requires-python = ">=3.10"
dependencies = []          # stdlib only; see requirements.lock
license = {text = "UNDETERMINED - see NOTICE (MC-019)"}

[tool.setuptools.packages.find]
include = ["inv24_microvm_runtime*"]

[tool.setuptools.package-data]
inv24_microvm_runtime = ["schemas/*.json", "VERSION", "*.md", "CHECKLIST.json"]
