[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inv60-wasm-application-fabric"
version = "4.3.0"
description = "INV-60 Wasm application fabric: hardened lattice control plane (reference) with pk_core conformance"
requires-python = ">=3.10"
dependencies = []          # stdlib only
authors = [{ name = "David Paul Russell", email = "davidpaulrussell@linearfinance.org" }]
# license: UNDECIDED - see LICENSE-DECISION.md (M02)

[project.optional-dependencies]
crosscheck = ["cryptography>=42"]

[tool.setuptools]
packages = ["inv60_wasm_application_fabric", "inv60_wasm_application_fabric.fabric", "pk_core"]
package-dir = { "" = ".." }

[tool.setuptools.package-data]
inv60_wasm_application_fabric = ["*.json", "*.md", "VERSION", "SHA256SUMS", "schemas/*.json", "wit/*.wit", "fixtures/*", "config/*.json", "config/overlays/*.json", "docs/*", "docs/runbooks/*", "ops/*.json"]
