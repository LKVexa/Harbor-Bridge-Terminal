# INV-38-C063 load scenarios.
scenarios: [steady, ramp, microburst, sustained_burst, overload, scale_out, scale_in, provider_failover, link_flap, recovery]
per_scenario_fields: [offered_load, msg_size_dist, queue_depth, concurrency, tenant_count, duration_s, warmup_s, success_criteria]
measure: [latency_dist, throughput, errors, fallback_rate, backlog, cpu_mem_pinned, drops_retries, recovery_time]
overload_rule: continue-beyond-first-saturation
