# INV-38-C097 incident severity model.
severities:
  SEV-1: {triggers: [memory_isolation_violation, sealing_failure, cross_tenant_access], page: immediate, ic: required}
  SEV-2: {triggers: [device_instability, widespread_fallback, slo_breach], page: immediate}
  SEV-3: {triggers: [observability_loss, elevated_retries], page: business-hours}
containment_actions: [disable_bypass, drain_queues, revoke_vf, quarantine_node, rollback_config, stop_service]
