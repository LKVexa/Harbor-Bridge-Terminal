# INV-38-C019 precedence lattice (highest first). Mirrors precedence.py::LATTICE.
lattice: [SECURITY, ISOLATION, RESIDENCY, CORRECTNESS, AVAILABILITY, PERFORMANCE, COST]
rules:
  - id: PR-01
    text: Security and DMA isolation override latency/throughput optimization.
    requires_exception_to_override: true
  - id: PR-02
    text: Kernel fallback may not route data outside an allowed residency locality merely to preserve availability.
  - id: PR-03
    text: SLO conflict with queue/rate/memory limits must not silently relax a safety limit.
emergency_override:
  authorizer: security-architecture-board
  max_duration_hours: 24
  mandatory_audit_fields: [actor, reason, blast_radius, expiry]
