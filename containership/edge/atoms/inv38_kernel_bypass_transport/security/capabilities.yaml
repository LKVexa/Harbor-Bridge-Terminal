# INV-38-C024 capability model. Mirrors authz.py::CAPABILITIES.
capabilities: [register, deregister, post, poll, configure, drain, reset, diagnose, administer]
principal_classes:
  workload:  [register, deregister, post, poll]
  operator:  [configure, drain, diagnose]
  admin:     [reset, administer, configure, drain, diagnose]
  provider:  [poll]
key_binding: [tenant, workload, device, generation, access_direction]
step_up_required_for: [reset, administer]
