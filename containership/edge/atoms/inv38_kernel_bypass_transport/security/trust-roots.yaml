# INV-38-C023 trust roots per boundary.
boundaries:
  workload_to_inv38: {principal: workload-identity, credential: spiffe-svid, max_lifetime_h: 24}
  control_to_inv38:  {principal: operator-identity, credential: mtls-cert, max_lifetime_h: 8}
  peer_to_peer:      {principal: node-identity, credential: mtls-cert, mutual: true, downgrade_protection: true}
  provider_to_inv38: {principal: provider-identity, credential: attested-token, bind_to_device: true}
  artifact_loader:   {principal: build-release-identity, credential: signed-manifest}
clock_skew_tolerance_s: 30
