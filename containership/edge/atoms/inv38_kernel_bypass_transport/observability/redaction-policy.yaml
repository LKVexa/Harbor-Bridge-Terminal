# INV-38-C075 field-level redaction classification.
redact_always: [payload, mr_key, credential, secret, token, addr]
tenant_scoped: [tenant, workload]
opaque_query_keys: [operation_id, queue_id, region_fingerprint, provider_id, config_generation]
diagnostic_limits: {max_result_rows: 1000, max_bytes: 1048576, max_seconds: 5, max_concurrency: 2}
