# INV-38-C080 alert rules.
alerts:
  - {id: A-SAFETY, expr: memory_safety_violations > 0, severity: SEV-1, page: immediate, runbook: ops/runbooks/oob-dma-anomaly.md}
  - {id: A-SEAL, expr: sealing_violations > 0, severity: SEV-1, page: immediate, runbook: ops/runbooks/sealing-failure.md}
  - {id: A-STALL, expr: oldest_inflight_age_s > 0.05 and completion_delta == 0, severity: SEV-2, window: 30s, runbook: ops/runbooks/provider-stall.md}
  - {id: A-FALLBACK, expr: fallback_rate > 0.2, severity: SEV-3, window: 5m, runbook: ops/runbooks/widespread-fallback.md}
