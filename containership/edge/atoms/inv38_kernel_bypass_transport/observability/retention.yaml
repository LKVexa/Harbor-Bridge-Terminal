# INV-38-C079 retention/sampling. Mirrors telemetry_policy.py.
retention_days: {metrics: 15, logs: 7, traces: 3, security_audit: 365, diagnostics: 2, release_evidence: 3650}
sample_rate:    {metrics: 1.0, logs: 0.1, traces: 0.01, security_audit: 1.0, diagnostics: 1.0, release_evidence: 1.0}
export_allowlist: [otlp-collector.internal]
never_sample: [security_audit]
