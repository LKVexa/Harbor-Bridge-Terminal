# INV-38-C070 performance gate config. Mirrors perf_gate.py thresholds.
require_baseline: true
prohibit_incompatible_baseline: true
thresholds_pct:   # lower-is-better metrics: max allowed % increase; throughput: max allowed % drop
  startup_s: 5.0
  p95_us: 5.0
  p99_us: 5.0
  p999_us: 10.0
  max_us: 10.0
  pinned_mem_mb: 5.0
  throughput_mps: 5.0
hard_fail_on: [safety_regression, resource_limit_regression, missing_evidence]
waiver_required_for: accepted_regression
