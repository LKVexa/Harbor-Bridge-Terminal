# INV-38-C027 version negotiation policy. Mirrors negotiation.py.
supported_schema_versions: [1, 2]
min_security_version: 1
mixed_version_matrix:
  "N/N": interoperate
  "N/N-1": interoperate
  "N/N+1": negotiate-down-to-common
  "unsupported-old": reject
  "unsupported-new": reject
downgrade_protection: enforced
unknown_required_field: reject
