# INV-38-C042 least-privilege matrix. Mirrors privilege_check.py.
data_plane_identity:
  run_as_root: false
  allowed_capabilities: [CAP_IPC_LOCK]
  forbidden_capabilities: [CAP_SYS_ADMIN, CAP_NET_ADMIN, CAP_SYS_RAWIO, CAP_DAC_OVERRIDE]
  device_scope: assigned-VF-only
privileged_setup_helper:
  scope: minimal-request-protocol
  drops_privileges_before_data_path: true
