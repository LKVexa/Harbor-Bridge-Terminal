# INV-38-C053 retry policy. Mirrors retry.py::RetryPolicy defaults.
max_attempts: 4
base_delay_s: 0.001
max_delay_s: 0.05
max_elapsed_s: 0.5
multiplier: 2.0
jitter_fraction: 0.5
never_retry: [PK_BYPASS_OUT_OF_BOUNDS, PK_BYPASS_NOT_REGISTERED, PK_BYPASS_STALE_KEY, PK_BYPASS_UNAUTHORIZED, PK_BYPASS_AUTH_FAILED]
