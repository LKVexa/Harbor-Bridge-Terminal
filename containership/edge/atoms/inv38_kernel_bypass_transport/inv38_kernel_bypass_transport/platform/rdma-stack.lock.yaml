# INV-38-C031 pinned kernel-bypass stack. Digests/versions are placeholders to be
# populated during hardware qualification; 'latest' is prohibited.
provider: rdma-core
userspace_lib: libibverbs
pins:
  rdma_core: {version: "UNPINNED", digest: "UNPINNED"}
  libibverbs: {version: "UNPINNED", digest: "UNPINNED"}
  kernel_modules: {mlx5_core: "UNPINNED", mlx5_ib: "UNPINNED"}
  nic_firmware: {model: "UNPINNED", version: "UNPINNED"}
supported_modes:
  - {mode: RoCEv2, status: qualification-required}
  - {mode: InfiniBand, status: qualification-required}
  - {mode: SR-IOV_VF, status: qualification-required}
require_iommu: true
prohibited:
  - floating-latest-dependencies
  - unqualified-firmware
