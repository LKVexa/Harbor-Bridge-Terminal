# INV-36 CI (MC-23). Actions are pinned by full commit SHA (resolved 2026-09-22 via git ls-remote):
#   actions/checkout v4.2.2        11bd71901bbe5b1630ceea73d27597364c9af683
#   actions/setup-python v5.6.0    a26af69be951a213d495a4c3e4e4022e16d87065
#   actions/upload-artifact v4.6.2 ea165f8d65b6e75b540449e92b4886f43607fa02
#   actions/download-artifact v4.3.0 d3f86a106a0bac45b974a628896c90dbdf5c8093
# Layout note: the repository root IS the package directory (package-dir "."), so jobs check out into
# ./inv36_control_transport and run from the parent.
name: inv36-ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: test (py${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {path: inv36_control_transport, fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "${{ matrix.python }}"}
      - name: install declared runtime deps only
        run: python -m pip install -r inv36_control_transport/requirements.txt
      - name: compile/import
        run: python -m compileall -q inv36_control_transport && python -c "import inv36_control_transport"
      - name: generated wire code is fresh
        run: python -m inv36_control_transport.tools.gen_wire --check
      - name: unit + integration (normal)
        run: python -m unittest discover -s inv36_control_transport/tests -t inv36_control_transport/tests -v
      - name: unit + integration (python -O)
        run: python -O -m unittest discover -s inv36_control_transport/tests -t inv36_control_transport/tests
      - name: traceability / checklist ledger / docs consistency / secrets
        run: |
          python -m inv36_control_transport.tools.traceability --check
          python -m inv36_control_transport.tools.mc_status --check
          python -m inv36_control_transport.tools.docs_check
          python -m inv36_control_transport.tools.secret_scan
      - name: property tests + bounded fuzz (PR)
        run: python -m inv36_control_transport.tools.fuzz --iterations 300 --seed ${{ github.run_number }} --out fuzz.json
      - name: perf smoke vs reference baseline
        run: |
          python -m inv36_control_transport.tools.bench --profile smoke --out bench.json
          python -m inv36_control_transport.tools.bench --compare inv36_control_transport/perf/baseline-reference.json bench.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: test-${{ matrix.os }}-${{ matrix.python }}
          path: |
            fuzz.json
            bench.json
            inv36_control_transport/fixtures/fuzz-regressions/
          retention-days: 90

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {path: inv36_control_transport}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.11"}
      - run: python -m pip install -r inv36_control_transport/requirements.txt ruff==0.6.9 mypy==1.11.2
      - name: ruff (pycodestyle, pyflakes, bugbear, bandit rules)
        run: cd inv36_control_transport && ruff check .
      - name: mypy
        run: mypy inv36_control_transport --exclude 'inv36_control_transport/tests/'

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {path: inv36_control_transport}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.11"}
      - run: python -m pip install pip-audit==2.7.3 pip-tools==7.4.1
      - name: hash-pinned lock (MC-17.002)
        run: pip-compile --generate-hashes --output-file requirements.lock inv36_control_transport/requirements.txt
      - name: dependency vulnerability scan
        run: pip-audit -r requirements.lock --require-hashes -f json -o pip-audit.json
      - name: license check for runtime deps
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m inv36_control_transport.tools.release licenses
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: security-reports, path: "pip-audit.json\nrequirements.lock", retention-days: 90}

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [test, lint, security]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {path: inv36_control_transport, fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.11"}
      - run: python -m pip install -r inv36_control_transport/requirements.txt "setuptools>=68" wheel
      - name: build wheel + sdist from clean checkout; manifest check
        run: python -m inv36_control_transport.tools.release build --out dist
      - name: install built wheel into a clean venv and smoke test
        run: |
          python -m venv /tmp/clean && /tmp/clean/bin/pip install -r inv36_control_transport/requirements.txt dist/*.whl
          cd /tmp && /tmp/clean/bin/python -c "import inv36_control_transport as t, inv36_control_transport.testing as w, inv36_control_transport.messages as m; W=w.World(); s,c=w.connect_pair(W.endpoint('h:1','host_agent','t1',handlers={'HEARTBEAT':lambda p,x:m.ControlMessage.of('HEARTBEAT','t1',b'pong')}),W.endpoint('g:1','guest_agent','t1')); c.send(m.ControlMessage.of('HEARTBEAT','t1')); s.serve_one(); assert c.receive().body==b'pong'; print('wheel smoke ok', t.__version__)"
      - name: sbom + provenance
        run: |
          python -m inv36_control_transport.tools.release sbom --out dist
          python -m inv36_control_transport.tools.release provenance --out dist --builder "https://github.com/${{ github.repository }}/.github/workflows/ci.yml@${{ github.ref }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: dist, path: dist/, retention-days: 90}

  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {path: inv36_control_transport, fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.11"}
      - run: python -m pip install -r inv36_control_transport/requirements.txt
      - name: long fuzz campaign (date-derived seed)
        run: python -m inv36_control_transport.tools.fuzz --iterations 20000 --seed $(date +%Y%m%d) --out fuzz-nightly.json
      - name: full benchmark + regression gate
        run: |
          python -m inv36_control_transport.tools.bench --profile full --out bench-full.json
          python -m inv36_control_transport.tools.bench --compare inv36_control_transport/perf/baseline-reference.json bench-full.json
      - name: soak (10 min) + fleet (200 guests)
        run: python -m inv36_control_transport.tools.soak --seconds 600 --fleet 200 --out soak.json
      - name: full local gate (evidence)
        run: python -m inv36_control_transport.audit --out evidence || true   # G10/G13 fail until governance/pk_core exist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: nightly-evidence, path: "fuzz-nightly.json\nbench-full.json\nsoak.json\nevidence/", retention-days: 400}

  real-vsock:
    # Requires a self-hosted runner inside a certified VM row (compat/matrix.json R1-R3) with a peer agent.
    if: github.event_name == 'schedule' && vars.INV36_VSOCK_RUNNER_READY == 'true'
    runs-on: [self-hosted, linux, vsock-certified]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {path: inv36_control_transport}
      - run: python3 -m inv36_control_transport.tools.vsock_smoke --peer-cid ${{ vars.INV36_PEER_CID }} --out vsock-smoke.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: vsock-smoke, path: vsock-smoke.json, retention-days: 400}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release          # protected: required reviewers configured by the repository owner
    permissions:
      contents: read
      id-token: write             # OIDC for the managed signing identity; only in this job
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {path: inv36_control_transport, fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.11"}
      - run: python -m pip install -r inv36_control_transport/requirements.txt
      - name: download exactly the validated build artifacts (never rebuild)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with: {name: dist, path: dist}
      - name: production certification gate (SKIP/ERROR block release)
        run: python -m inv36_control_transport.audit --certify --out evidence --artifact-digest "$(sha256sum dist/*.whl | cut -d' ' -f1)"
      - name: sign with managed identity
        run: echo "Signing service integration is environment-specific (MC-17.014); fail closed until configured." && exit 1
