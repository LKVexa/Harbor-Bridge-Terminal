[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inv02-container-substrate"
version = "5.0.0"
description = "INV-02 container substrate: OCI image identity, durable CAS, distribution client, unpack, runtime spec, admission policy (stdlib only)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
# License intentionally unset: see LICENSE-STATUS.md (owner decision pending).
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Topic :: System :: Software Distribution",
]

[project.optional-dependencies]
conformance = []  # pk_core is provided by the estate checkout, not PyPI

[tool.setuptools]
packages = ["inv02_container_substrate", "inv02_container_substrate.tests",
            "inv02_container_substrate.tests.integration", "inv02_container_substrate.tools"]
package-dir = {"inv02_container_substrate" = "."}

[tool.setuptools.package-data]
"inv02_container_substrate" = ["*.md", "*.json", "VERSION", "docs/**/*", "waivers/*.json"]
"inv02_container_substrate.tests.integration" = ["probe.c"]
