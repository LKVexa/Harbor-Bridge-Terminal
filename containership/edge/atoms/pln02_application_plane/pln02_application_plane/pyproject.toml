[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pln02-application-plane"
version = "4.3.0"
description = "PLN-02 application plane: deterministic composition resolver with signed catalogue, policy, fenced revision store and audit."
readme = "README.md"
requires-python = ">=3.9"
# License-Expression intentionally omitted: owner decision pending (see LICENSE, MC-39).
dependencies = []

[project.optional-dependencies]
schema = ["jsonschema==4.23.0"]
ed25519 = ["cryptography==43.0.1"]

[tool.setuptools]
package-dir = {"pln02_application_plane" = "."}
packages = ["pln02_application_plane", "pln02_application_plane.tools"]

[tool.setuptools.package-data]
pln02_application_plane = ["schemas/*.json", "CHECKLIST.json", "TRACEABILITY.json", "perf/*.json", "VERSION"]
