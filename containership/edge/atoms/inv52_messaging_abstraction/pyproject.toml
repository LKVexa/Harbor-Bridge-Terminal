[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inv52-messaging-abstraction"
version = "4.3.0"
description = "Broker-independent reference messaging abstraction for INV-52"
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools]
packages = ["inv52_messaging_abstraction", "inv52_messaging_abstraction.tools"]
package-dir = {"inv52_messaging_abstraction" = ".", "inv52_messaging_abstraction.tools" = "tools"}

[tool.setuptools.package-data]
inv52_messaging_abstraction = ["VERSION", "CHECKSUMS.sha256", "CHECKLIST.json", "*.md", "POST_UPDATE_AUDIT*.json", "schemas/*.json", "docs/*.md", "docs/adr/*.md", "governance/*", "examples/config/*.json", "examples/fixtures/*.json", "perf/*.json", "deploy/dapr/*", "deploy/observability/*"]

[project.scripts]
inv52 = "inv52_messaging_abstraction.__main__:main"
