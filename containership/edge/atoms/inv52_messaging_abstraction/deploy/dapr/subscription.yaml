# Declarative subscription: INV-52 routing rules + dead-letter topic (PK_MSG_SUBSCRIBE/1 declarative form).
apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: orders
  namespace: inv52
spec:
  pubsubname: order-events
  topic: orders
  routes:
    rules:
      - match: event.data.total >= 100
        path: /orders/large
    default: /orders/small
  deadLetterTopic: orders-deadletter
scopes:
  - fulfilment
