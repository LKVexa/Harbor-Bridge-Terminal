# Alert taxonomy (C080) — mirrors observability.classify(); thresholds PROPOSED.
groups:
  - name: inv52
    rules:
      - alert: INV52AttackSuspected
        expr: increase(inv52_denied_total[5m]) >= 20 and increase(inv52_denied_total[5m]) / (increase(inv52_published_total[5m]) + increase(inv52_denied_total[5m])) >= 0.2
        labels: {severity: sev1, class: attack_suspected}
      - alert: INV52DependencyFailure
        expr: increase(inv52_sink_errors_total[5m]) / clamp_min(increase(inv52_published_total[5m]), 1) >= 0.2
        labels: {severity: sev2, class: dependency_failure}
      - alert: INV52SoftwareDefect
        expr: increase(inv52_route_errors_total[5m]) / clamp_min(increase(inv52_published_total[5m]), 1) >= 0.2
        labels: {severity: sev2, class: software_defect}
      - alert: INV52Overload
        expr: increase(inv52_shed_total[5m]) / clamp_min(increase(inv52_published_total[5m]) + increase(inv52_shed_total[5m]), 1) >= 0.05
        for: 15m
        labels: {severity: sev2, class: overload}
      - alert: INV52Degradation
        expr: (increase(inv52_route_errors_total[5m]) + increase(inv52_sink_errors_total[5m])) / clamp_min(increase(inv52_published_total[5m]), 1) >= 0.01
        for: 10m
        labels: {severity: sev3, class: degradation}
      - alert: INV52PolicyRejection
        expr: increase(inv52_denied_total[15m]) > 0
        labels: {severity: info, class: policy_rejection}
      - alert: INV52PublishLatencyP99
        expr: histogram_quantile(0.99, sum by (le) (rate(inv52_publish_latency_seconds_bucket[5m]))) > 0.001
        for: 10m
        labels: {severity: sev3, class: degradation}
      - alert: INV52DeadLetterBacklogHigh
        expr: inv52_dead_letter_backlog > 8000
        labels: {severity: sev3, class: degradation}
