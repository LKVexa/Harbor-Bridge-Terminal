# Distribution metadata for GAP-12 (G12-I101/I102/I103).  The runtime is
# standard-library only; `cryptography` is the single optional dependency
# (end-to-end AEAD, G12-D044) and is pinned exactly.
[build-system]
requires = ["setuptools==69.5.1"]
build-backend = "setuptools.build_meta"

[project]
name = "gap12-wan-resilience-nat-traversal"
version = "4.3.0"
description = "GAP-12 WAN resilience and NAT traversal: path state machine plus stdlib traversal runtime"
requires-python = ">=3.10,<3.14"
license = {text = "Proprietary - LinearFinance.org"}
dependencies = []

[project.optional-dependencies]
e2e = ["cryptography==46.0.7"]

[tool.gap12.support-matrix]
# Declared matrix.  "verified" cells were executed by ops/ci.sh in this build;
# "declared" cells are claimed by metadata only and are NOT evidence.
cells = [
  {python = "3.11", os = "linux-x86_64", kernel_ipv6 = false, status = "verified"},
  {python = "3.10", os = "linux-x86_64", status = "declared"},
  {python = "3.12", os = "linux-x86_64", status = "declared"},
  {python = "3.13", os = "linux-x86_64", status = "declared"},
  {python = "3.11", os = "windows", status = "unsupported-lab (netns lab is Linux-only; runtime untested)"},
  {python = "3.11", os = "macos", status = "unsupported-lab (netns lab is Linux-only; runtime untested)"},
]
