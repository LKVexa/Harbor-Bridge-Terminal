# generated by tools/build_release.py from telemetry.ALERT_RULES - do not edit
groups:
  - name: inv29
    rules:
      - alert: INV29SingleLayerAdmitted
        expr: "sum(inv29_compositions_total{outcome=\"admitted\"}) and on() inv29_min_layer_count < 2"
        for: 0m
        labels:
          severity: SEV1
          class: security-invariant
        annotations:
          action: "emergency disable; page security on-call"
      - alert: INV29AttestationFailuresSpike
        expr: "rate(inv29_layer_failures_total{code=\"INV29-E-ATTESTATION\"}[5m]) > 0.1"
        for: 10m
        labels:
          severity: SEV2
          class: trust-chain
        annotations:
          action: "check INV-27/INV-44 signer health and key revocations"
      - alert: INV29DependencyUnavailable
        expr: "inv29_dependency_available == 0"
        for: 5m
        labels:
          severity: SEV2
          class: dependency
        annotations:
          action: "admission fails closed; restore dependency; see RUNBOOKS.md#dependency-loss"
      - alert: INV29ImportRefusalRate
        expr: "rate(inv29_import_refusals_total[15m]) > 1"
        for: 15m
        labels:
          severity: SEV3
          class: workload-config
        annotations:
          action: "notify workload owners; not a platform fault"
      - alert: INV29AdmissionLatencyP99
        expr: "histogram_quantile(0.99, rate(inv29_admission_latency_ms_bucket[5m])) > 25"
        for: 15m
        labels:
          severity: SEV3
          class: performance
        annotations:
          action: "see CAPACITY.md"
      - alert: INV29ReplayCacheSaturated
        expr: "inv29_replay_cache_fill_ratio > 0.9"
        for: 5m
        labels:
          severity: SEV2
          class: capacity
        annotations:
          action: "scale replicas / shorten record TTL; saturation refuses admissions"
      - alert: INV29MetricCardinalityOverflow
        expr: "increase(inv29_metric_series_dropped_total[1h]) > 0"
        for: 0m
        labels:
          severity: SEV4
          class: telemetry
        annotations:
          action: "review labels"
