# INV-29 CI (MC042): compile, unit, optimized-mode, conformance, fuzz smoke,
# perf gate, secret/vuln scan, packaging, evidence + gate artifact.
name: inv29-ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with: { path: inv29_hybrid_wasm_unikernel }
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - name: compile
        run: python -m compileall -q inv29_hybrid_wasm_unikernel
      - name: pk_core (pinned sibling; fails loudly if the pin cannot be resolved)
        if: ${{ vars.PK_CORE_WHEEL_URL != '' }}
        run: python -m pip install "${{ vars.PK_CORE_WHEEL_URL }}"
      - name: all suites, normal and -O
        working-directory: inv29_hybrid_wasm_unikernel
        run: python tools/run_tests.py
      - name: fuzz smoke (60 s)
        working-directory: inv29_hybrid_wasm_unikernel
        run: python tools/fuzz.py 60 ${{ github.run_id }}
      - name: packaging
        working-directory: inv29_hybrid_wasm_unikernel
        run: python -m pip wheel --no-deps -w dist .
  release-evidence:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { path: inv29_hybrid_wasm_unikernel }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: tests + perf gate + scans + SBOM + provenance + gate
        working-directory: inv29_hybrid_wasm_unikernel
        run: |
          python tools/run_tests.py || true
          python tools/bench.py
          python tools/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: inv29-evidence
          path: |
            inv29_hybrid_wasm_unikernel/conformance/
            inv29_hybrid_wasm_unikernel/release/
            inv29_hybrid_wasm_unikernel/sbom/
            inv29_hybrid_wasm_unikernel/security/
            inv29_hybrid_wasm_unikernel/perf/
