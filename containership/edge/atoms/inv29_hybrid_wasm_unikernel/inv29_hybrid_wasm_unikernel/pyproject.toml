[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "inv29-hybrid-wasm-unikernel"
version = "4.3.0"
description = "INV-29 Hybrid Wasm/unikernel: two-layer composition and admission element (Post-Kubernetes series)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "David Paul Russell", email = "davidpaulrussell@linearfinance.org" }]
# license: not yet chosen by the owner (INV29-MC020, OWNER_ACTION) - see NOTICE
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: POSIX :: Linux",
]
# The security core is stdlib-only. pk_core is required only for the
# 100-item component assessment/gate and is resolved as a workspace sibling or
# a pinned wheel (see dependencies.lock.json); PK_CORE_PATH is a development override only.
dependencies = []

[project.optional-dependencies]
conformance = ["pk_core>=4.0.0,<5"]

[tool.setuptools]
packages = ["inv29_hybrid_wasm_unikernel", "inv29_hybrid_wasm_unikernel.tests"]
package-dir = { "inv29_hybrid_wasm_unikernel" = ".", "inv29_hybrid_wasm_unikernel.tests" = "tests" }

[tool.setuptools.package-data]
inv29_hybrid_wasm_unikernel = ["schemas/*.json", "CHECKLIST.json", "VERSION"]
