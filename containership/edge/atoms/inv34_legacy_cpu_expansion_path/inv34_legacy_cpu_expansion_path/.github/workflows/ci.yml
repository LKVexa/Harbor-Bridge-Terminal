name: inv34-ci
on: [push, pull_request]
permissions: {contents: read}
jobs:
  ci:
    runs-on: ubuntu-24.04
    strategy: {matrix: {python: ["3.10", "3.11", "3.12"]}}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2, pinned by digest
        with: {path: inv34_legacy_cpu_expansion_path}
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with: {python-version: "${{ matrix.python }}"}
      - run: python -B inv34_legacy_cpu_expansion_path/tools/ci.py
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8c75cf6a6  # v4.4.3
        with: {name: evidence-${{ matrix.python }}, path: inv34_legacy_cpu_expansion_path/governance/}
