[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inv34-legacy-cpu-expansion-path"
version = "5.1.0"
description = "INV-34 conventional-VM CPU expansion path (ACPI CPU hot-add only) — reference control plane"
requires-python = ">=3.10"
dependencies = []            # stdlib only at runtime
# license: intentionally absent — no licence has been chosen by the rights holder (MC-074, governance/LICENSE_REQUIRED.md)

[project.optional-dependencies]
certification = []          # pk_core: UNRESOLVED, see governance/DEPENDENCIES.lock.json

[tool.setuptools]
package-dir = {"inv34_legacy_cpu_expansion_path" = "."}
packages = ["inv34_legacy_cpu_expansion_path", "inv34_legacy_cpu_expansion_path.production",
            "inv34_legacy_cpu_expansion_path.production.adapters"]
