# INV-63 CI (INV-63-C084, C070, C090). Matrix covers the compatibility matrix; arm64 requires an arm runner.
name: inv63
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - run: pip install -r inv63_wasm_deployment_manager/requirements.lock
      - run: python -m unittest discover -s inv63_wasm_deployment_manager/tests -v
      - run: python -O -m unittest discover -s inv63_wasm_deployment_manager/tests
      - run: python inv63_wasm_deployment_manager/perf/bench.py --quick --gate --out perf-${{ matrix.os }}-${{ matrix.python }}.json
      - run: python inv63_wasm_deployment_manager/audit.py --out-dir evidence
      - run: python inv63_wasm_deployment_manager/gate.py --out release/GATE_RESULT.json || true   # verdict is the artifact; NO_GO/BLOCKED expected until approvals exist
      - uses: actions/upload-artifact@v4
        with: {name: "inv63-evidence-${{ matrix.os }}-${{ matrix.python }}", path: "evidence/\nrelease/\nperf-*.json"}
