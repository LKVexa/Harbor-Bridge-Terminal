[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "inv35-high-performance-vm-io"
version = "4.3.0"
description = "INV-35 High-performance VM I/O: descriptor-validation safety core, production-shaped runtime and release gate"
requires-python = ">=3.11,<3.14"
dependencies = []            # the runtime is stdlib-only by design
# license: intentionally unset until governance/LICENSE_DECISION.json is approved (REPO-001)

[project.optional-dependencies]
certification = []           # pk_core: approved version/digest pending from its owner (release/dependencies.json)
dev = ["ruff==0.6.9", "mypy==1.11.2", "bandit==1.7.10", "pip-audit==2.7.3"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S", "UP", "PL"]
ignore = ["PLR0913", "PLR2004", "PLR0912", "PLR0915", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PL", "B"]
"benchmarks/**" = ["S311"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", "benchmarks"]
