name: inv35-verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { path: inv35_high_performance_vm_i_o }
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - name: Release gate
        working-directory: inv35_high_performance_vm_i_o
        env:
          INV35_EVIDENCE_KEY: ${{ secrets.INV35_EVIDENCE_KEY }}
          INV35_BUILDER_ID: github-actions/${{ github.repository }}/${{ github.run_id }}
          PK_CORE_PATH: ${{ vars.PK_CORE_PATH }}
        run: |
          python verify.py; rc=$?
          # 0 = PASS, 2 = PARTIAL (non-green: fail on protected branches), 1 = FAIL
          if [ "$rc" = "1" ]; then exit 1; fi
          if [ "$rc" = "2" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then echo "::error::VERIFY=PARTIAL is not production-green"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            inv35_high_performance_vm_i_o/conformance/
            inv35_high_performance_vm_i_o/evidence/
            inv35_high_performance_vm_i_o/release/
  static-analysis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install ruff==0.6.9 mypy==1.11.2 bandit==1.7.10 pip-audit==2.7.3
      - run: ruff check .
      - run: mypy runtime io_model.py
      - run: bandit -q -r runtime io_model.py -c pyproject.toml
      - run: pip-audit --strict || true   # stdlib-only today; becomes blocking when dependencies exist
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITLEAKS_CONFIG: .gitleaks.toml }
