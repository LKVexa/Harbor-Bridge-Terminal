[build-system]
requires = []
build-backend = "tools.build_backend"
backend-path = ["."]

[project]
name = "inv13-system-interface"
version = "4.3.0"
description = "INV-13 System Interface: capability-confined WASI-style host layer (reference policy model + stdlib host providers)"
requires-python = ">=3.10"
license = { text = "Proprietary - LinearFinance.org (see OWNERSHIP.md)" }
dependencies = []                     # host layer is stdlib-only

[project.optional-dependencies]
assessment = ["pk_core"]              # external framework, not vendored; version pin in COMPAT_MATRIX

[tool.inv13]
engines = { v8-node = ">=18" }        # optional real-engine adapter (core Wasm)
supported-python = ["3.10", "3.11", "3.12", "3.13"]
tested-python = ["3.11.15"]
