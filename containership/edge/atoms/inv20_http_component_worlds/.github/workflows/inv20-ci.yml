# INV-20 authoritative CI / release gate (component 27).
# Third-party actions pinned by full commit SHA; least-privilege token; PR jobs unprivileged.
name: inv20-ci
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: inv20-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with: { path: inv20_http_component_worlds, persist-credentials: false }
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with: { python-version: "${{ matrix.python }}" }
      - name: Record source revision
        run: echo "${{ github.sha }}" > inv20_http_component_worlds/SOURCE_REVISION
      - name: Pinned build tools only
        run: python -m pip install "setuptools==68.1.2" "wheel==0.42.0"
      - name: Install pk_core (approved source, pinned)   # BLOCKED until WI-INV20-01 names the registry
        run: python -m pip install "pk_core>=1.0.0,<2.0.0" || echo "pk_core unavailable -> VERIFY returns BLOCKED"
      - name: VERIFY (fails closed; exit 2 = BLOCKED is a failure for release)
        run: python inv20_http_component_worlds/VERIFY.py
      - name: Stale generated files
        run: git -C inv20_http_component_worlds diff --exit-code -- _wit_generated.py
      - uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b  # v4.5.0
        if: always()
        with:
          name: evidence-${{ matrix.os }}-${{ matrix.python }}
          path: |
            inv20_http_component_worlds/evidence/
            inv20_http_component_worlds/dist/
            inv20_http_component_worlds/bench/last_run.json
          retention-days: 90
  fuzz-nightly:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { path: inv20_http_component_worlds, persist-credentials: false }
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with: { python-version: "3.12" }
      - run: for s in $(seq 1 20); do python -m inv20_http_component_worlds.fuzz.fuzz_parsers --iterations 50000 --seed $s || exit 1; done
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify]
    runs-on: ubuntu-24.04
    environment: production-release     # protected: required reviewers = release approver (UNASSIGNED)
    permissions:
      contents: write
      id-token: write                   # for keyless signing once approved (component 9)
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { path: inv20_http_component_worlds, persist-credentials: false }
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with: { python-version: "3.12" }
      - run: python -m pip install "setuptools==68.1.2" "wheel==0.42.0"
      - name: Gate must be GO for this exact revision
        run: python inv20_http_component_worlds/VERIFY.py   # any non-zero exit stops the release
      - name: Sign artifacts and evidence
        run: echo "BLOCKED - no approved signing infrastructure" && exit 1
