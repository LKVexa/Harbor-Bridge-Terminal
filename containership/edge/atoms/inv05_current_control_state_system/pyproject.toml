[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inv05-current-control-state-system"
version = "4.3.0"
description = "INV-05 current control-state system: revisioned MVCC control state with CAS transactions, watches, leases, compaction, durable WAL and mTLS transport"
requires-python = ">=3.10,<3.14"
dependencies = []
[project.optional-dependencies]
encryption = ["cryptography>=42,<47"]

[tool.setuptools]
packages = ["inv05_current_control_state_system", "inv05_current_control_state_system.conformance"]
