[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inv57-durable-execution"
version = "4.3.0"
description = "INV-57 durable workflow replay engine with fenced persistent history (stdlib only)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
# RG-04: no license is declared. Choosing one is the owner's decision; this build does not guess.
classifiers = ["Programming Language :: Python :: 3", "Private :: Do Not Upload"]

[project.optional-dependencies]
conformance = []   # RG-01: pk_core source/version unknown; cannot be pinned here

[project.scripts]
inv57 = "inv57_durable_execution.__main__:main"

[tool.setuptools]
package-dir = {"inv57_durable_execution" = "."}
packages = ["inv57_durable_execution", "inv57_durable_execution.tests", "inv57_durable_execution.tools"]

[tool.setuptools.package-data]
inv57_durable_execution = ["VERSION", "*.json", "*.md", "OWNERS.yaml", "schemas/*.json",
                           "fixtures/*.json", "docs/*.md"]
