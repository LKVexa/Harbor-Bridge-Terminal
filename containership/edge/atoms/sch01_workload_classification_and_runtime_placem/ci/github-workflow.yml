# MC-59 / MC-45: hosted CI definition (not executed in this pass - no hosted runner).
name: sch01-ci
on: [push, pull_request]
permissions: {contents: read}
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: {path: sch01_workload_classification_and_runtime_placem}
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - run: sh sch01_workload_classification_and_runtime_placem/ci/ci.sh
        shell: bash
      - uses: actions/upload-artifact@v4
        with: {name: "evidence-${{ matrix.os }}-${{ matrix.python }}", path: sch01_workload_classification_and_runtime_placem/evidence/, retention-days: 90}
