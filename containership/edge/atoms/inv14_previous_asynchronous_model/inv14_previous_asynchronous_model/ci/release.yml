# GitHub Actions release pipeline for INV-14 (component P2-27).  Fails closed:
# verify_release.py exits non-zero whenever pk_core, a trusted signature, a real
# WASI runtime cell, adjacent layers or governance approvals are missing.
name: inv14-release
on: [push, pull_request]
jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest, windows-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - name: Standalone + optimized tests, contracts, fuzz, model check, faults, soak, bench
        run: python -B inv14_previous_asynchronous_model/verify_release.py --report ci-report.json
        env: {INV14_RELEASE: "1", PK_CORE_PATH: "${{ github.workspace }}/vendor"}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "inv14-${{ matrix.os }}-${{ matrix.python }}", path: ci-report.json}
