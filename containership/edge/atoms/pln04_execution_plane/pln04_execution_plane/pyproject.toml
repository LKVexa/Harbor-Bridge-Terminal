[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pln04-execution-plane"
version = "4.3.0"
description = "PLN-04 execution plane: attested isolation-tier admission, provider lifecycle and fencing"
requires-python = ">=3.10"
dependencies = []  # stdlib only; see requirements.lock
# license: NOT DECLARED - owner decision pending (M47, ops/WAIVERS.json W-007)

[project.optional-dependencies]
# certification = ["pk_core==<PIN REQUIRED>"]   # M02 BLOCKED: pk_core not supplied

[tool.setuptools]
packages = ["pln04_execution_plane", "pln04_execution_plane.tests"]
package-dir = {"pln04_execution_plane" = ".", "pln04_execution_plane.tests" = "tests"}

[tool.setuptools.package-data]
pln04_execution_plane = ["schemas/*.json", "config/*.json", "CHECKLIST.json", "VERSION"]
